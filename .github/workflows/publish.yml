name: Publish npm package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag, exactly v + package.json version (for example v0.1.3)
        required: true
        type: string
      authentication:
        description: npm trusted publisher (OIDC) or the configured NPM_TOKEN fallback
        required: true
        default: oidc
        type: choice
        options: [oidc, token]

permissions:
  contents: read

concurrency:
  group: track-npm-publish-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
      EXPECTED_TAG: ${{ needs.build.outputs.npm_tag }}
      PACKAGE_FILENAME: ${{ needs.build.outputs.filename }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
    steps:
      - name: Check out the exact verified source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          persist-credentials: false

      - name: Set up Node.js 24 and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm with trusted-publisher support
        run: npm install --global npm@12.0.2

      - name: Download the verified package from this run
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifacts

      - name: Verify downloaded archive and release identity
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          node scripts/verify-package.mjs "artifacts/${PACKAGE_FILENAME}" > artifacts/package-verification.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { normalizePackResult } from './scripts/release-package-utils.mjs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const packed = normalizePackResult(JSON.parse(readFileSync('artifacts/npm-pack.json', 'utf8')));
          const verified = JSON.parse(readFileSync('artifacts/package-verification.json', 'utf8'));
          if (pkg.name !== 'cqai-dsh-plugin-track' || pkg.version !== process.env.EXPECTED_VERSION || process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error('Release tag and source version no longer match.');
          if (packed.length !== 1 || packed[0].name !== pkg.name || packed[0].version !== pkg.version || packed[0].filename !== process.env.PACKAGE_FILENAME) throw new Error('Downloaded npm archive identity does not match the verified release.');
          if (verified.name !== pkg.name || verified.version !== pkg.version || verified.baseCommit !== process.env.SOURCE_COMMIT) throw new Error('Verified tarball does not match the expected package, version, and source commit.');
          const npmTag = pkg.version.includes('-') ? 'beta' : 'latest';
          if (process.env.EXPECTED_TAG !== npmTag || pkg.publishConfig?.tag !== npmTag) throw new Error('Unexpected npm distribution tag.');
          NODE

      - name: Check whether this exact npm package is already published
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const verified = JSON.parse(readFileSync('artifacts/package-verification.json', 'utf8'));
          const expectedVersion = process.env.EXPECTED_VERSION;
          if (typeof verified.integrity !== 'string' || verified.integrity.length === 0) throw new Error('Verified archive integrity is missing.');
          const url = `https://registry.npmjs.org/cqai-dsh-plugin-track/${encodeURIComponent(expectedVersion)}`;
          const response = await fetch(url, {
            signal: AbortSignal.timeout(30_000),
            redirect: 'error',
            headers: { accept: 'application/json' },
          });
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'should_publish=true\n');
            console.log(`cqai-dsh-plugin-track@${expectedVersion} has not been published.`);
          } else if (response.status === 200) {
            const manifest = await response.json();
            if (manifest?.name !== 'cqai-dsh-plugin-track' || manifest.version !== expectedVersion || manifest.dist?.integrity !== verified.integrity) throw new Error('The existing npm version does not match this verified archive.');
            appendFileSync(process.env.GITHUB_OUTPUT, 'should_publish=false\n');
            console.log(`cqai-dsh-plugin-track@${expectedVersion} is already published with this exact archive integrity; publication is skipped.`);
          } else {
            throw new Error(`npm registry returned unexpected status ${response.status}; publication is stopped.`);
          }
          NODE

      - name: Publish verified tarball with npm trusted publishing
        if: ${{ steps.registry.outputs.should_publish == 'true' && (github.event_name != 'workflow_dispatch' || inputs.authentication == 'oidc') }}
        run: npm publish "artifacts/${PACKAGE_FILENAME}" --ignore-scripts --access public --tag "$EXPECTED_TAG" --provenance

      - name: Publish verified tarball with configured token fallback
        if: ${{ steps.registry.outputs.should_publish == 'true' && github.event_name == 'workflow_dispatch' && inputs.authentication == 'token' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'NPM_TOKEN must be configured for the explicit token fallback.' >&2
            exit 1
          fi
          npm publish "artifacts/${PACKAGE_FILENAME}" --ignore-scripts --access public --tag "$EXPECTED_TAG" --provenance
